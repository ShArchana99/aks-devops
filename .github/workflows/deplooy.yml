name: Build and Deploy to AKS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: mysharchanaacr123.azurecr.io
  IMAGE_NAME: my-devops-app
  AKS_CLUSTER: devops-aks
  RESOURCE_GROUP: devops-rg

jobs:

  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Login to ACR
      run: az acr login --name mysharchanaacr123   

    - name: Build Docker image
      run: |
        docker build -t ${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} ./src

    - name: Push to ACR
      run: |
        docker push ${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to Azure
      uses: azure/login@v1
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}     ← fixed
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}     ← fixed
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}  ← fixed

    - name: Connect to AKS
      run: |
        az aks get-credentials \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.AKS_CLUSTER }}

    - name: Deploy to AKS
      run: |
        kubectl apply -f k8s/
        kubectl set image deployment/my-devops-app \
          my-devops-app=${{ env.ACR_NAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
